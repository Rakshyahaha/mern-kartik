 <!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css</title> 

    <link rel="stylesheet" href="index.css"> /

     <style>
       @import url('https://fonts.googleapis.com/css2?family=Playwrite+CZ:wght@100..400&display=swap'); */

      *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      } 

       body {
        padding: 10px;
      } 

      .bx {
        height: 500px;
        width: 500px;
        border: 1px solid black;
        background-image: linear-gradient(45deg, red, yellow,green);
        /* background-image: url("https://images.unsplash.com/photo-1763689389840-0afa417e0939?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHw5fHx8ZW58MHx8fHx8%27"); */
        background-repeat: no-repeat;
        background-size: cover;
        background-position:center;
        padding: 90px;     /* movement of text */
        /* to make the image dim sothat the text is clear */
        background-color: rgb(208, 200, 200);
        background-blend-mode:darken;
      }
      .cbx{
        background-color: white;
        backdrop-filter: blur(30px);
        font-size: 10px;

      }
    </style>
  </head>
  <body>
    <div class="bx"><div class="cbx"><h1>Hello jee</h1></div>
      </div>
  </body>

</html>
